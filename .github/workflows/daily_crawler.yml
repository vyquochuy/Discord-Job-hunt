name: Daily Job Ingestion Crawler
on:
  schedule:
    - cron: "0 0 * * *" # Chạy 7:00 AM mỗi ngày (giờ VN)
  workflow_dispatch:
jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Batch Ingestion
        env:
          BACKEND_API_URL: ${{ secrets.BACKEND_API_URL || vars.BACKEND_API_URL || 'https://job-hunt-backend-0hrl.onrender.com' }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET || vars.INTERNAL_API_SECRET }}
        run: |
          if [ -z "$INTERNAL_API_SECRET" ]; then
            echo "❌ INTERNAL_API_SECRET is not configured (set secret or variable)." >&2
            exit 1
          fi

          curl --fail-with-body --show-error --silent \
               -X POST "${BACKEND_API_URL%/}/api/v1/jobs/daily-batch" \
               -H "X-Internal-Secret: ${INTERNAL_API_SECRET}"
