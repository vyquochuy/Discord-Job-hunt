name: Checks

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      JWT_SECRET_KEY: ci-only-jwt-secret-not-for-deployment-0123456789
      INTERNAL_API_SECRET: ci-only-internal-secret-not-for-deployment-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      # ponytail: correctness-only lint until the existing style debt is cleaned up.
      - run: ruff check --isolated --select E9,F63,F7,F82 backend
      - run: python -m pytest -q
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/check_frontend_serving.py
        working-directory: .
